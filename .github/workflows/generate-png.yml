name: Generate transparent PNG badges
on:
  push:
    branches: [main]
    paths:
      - 'badges.json'
      - 'scripts/build_png.py'
      - '.github/workflows/generate-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Build 24 transparent PNG badges
        run: python scripts/build_png.py
      - name: Commit built assets if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark/*.png assets/light/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Build 24 transparent PNG badge assets"
            git push origin HEAD:main
          else
            echo "No updated PNG files"
          fi
